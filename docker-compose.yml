services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - streamworx-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: streamworx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - streamworx-net

  api-2:
    build: ./api-2
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamworx
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres
    networks:
      - streamworx-net

  api-1:
    build: ./api-1
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      API2_URL: http://api-2:8082
    depends_on:
      - redis
      - api-2
    networks:
      - streamworx-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - api-1
      - api-2
    networks:
      - streamworx-net

networks:
  streamworx-net:
    driver: bridge